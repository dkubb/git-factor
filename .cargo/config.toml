[alias]
clippy-all = ["clippy", "--all-features", "--all-targets", "--tests"]
coverage = [
  "llvm-cov",
  "nextest",
  "--all-features",
  "--branch",
  "--fail-under-functions",
  "100",
  "--fail-under-lines",
  "100",
  "--fail-under-regions",
  "100",
  "--workspace",
  "--cargo-quiet",
  "--show-progress",
  "none",
  "--status-level",
  "fail",
  "--final-status-level",
  "fail",
  "--success-output",
  "never",
]
fmt-all = ["fmt", "--all"]
test-all = [
  "nextest",
  "run",
  "--all-features",
  "--workspace",
  "--cargo-quiet",
  "--show-progress",
  "none",
  "--status-level",
  "fail",
  "--final-status-level",
  "fail",
  "--success-output",
  "never",
]
test-doc = ["test", "--doc", "--all-features", "--workspace"]

[build]
rustflags = ["--forbid", "unsafe_code", "--deny", "warnings"]

[deny]
config = ".cargo/deny.toml"

[env]
CLIPPY_CONF_DIR = { value = ".cargo", relative = true }
