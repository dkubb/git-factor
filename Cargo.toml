[package]
name = "git-factor"
description = "Split a large git commit into smaller atomic commits using interactive rebase."
version = "0.1.0"
authors = ["Dan Kubb <github@dan.kubb.ca>"]
edition = "2024"
license = "LicenseRef-Private"
publish = false
categories = ["command-line-utilities"]
keywords = ["git", "cli"]

[[bin]]
name = "git-factor"
path = "src/bin/git-factor.rs"
test = false

[[bin]]
name = "git-sequence-editor"
path = "src/bin/git-sequence-editor.rs"
test = false

[lints]
workspace = true

[workspace]
members = [".", "expect-fail-macro"]

[workspace.package]
edition = "2024"
publish = false
license = "LicenseRef-Private"

[workspace.dependencies]
clap = { version = "4.5.56", features = ["derive"] }
nonempty = "0.12.0"
thiserror = "2.0.18"

[dependencies]
clap = { workspace = true }
nonempty = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
expect-fail-macro = { version = "0.1.0", path = "expect-fail-macro" }
proptest = "1.9.0"
tempfile = "3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "deny", check-cfg = [
  'cfg(coverage)',
  'cfg(coverage_nightly)',
] }
missing_docs = "deny"
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"

unused_crate_dependencies = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
missing_crate_level_docs = "deny"
private_doc_tests = "deny"
unescaped_backticks = "deny"
